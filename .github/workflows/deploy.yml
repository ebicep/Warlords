name: Build and Deploy

on:
  push:
    branches: [ dev ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Locate output JAR
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'Warlords-*.jar' ! -name '*-all.jar')
          echo "JAR_PATH=$JAR" >> $GITHUB_ENV

      - name: Upload plugin to server
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          local_path: ${{ env.JAR_PATH }}
          remote_path: '/__VDS__Datastore-DefaultDatastore/Warlords2DockerClone01/Minecraft/plugins/test'
          sftp_only: true
