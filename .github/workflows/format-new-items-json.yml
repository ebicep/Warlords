name: Format NEW_ITEMS JSON

on:
  push:
    branches:
      - drowned-realms-update

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: drowned-realms-update

      - name: Format NEW_ITEMS.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("config/NEW_ITEMS.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit formatted configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/format-new-items-json.yml
          git add config/NEW_ITEMS.json
          git commit -m "Format NEW_ITEMS config"
          git push origin HEAD:drowned-realms-update
